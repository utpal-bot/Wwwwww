<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cyrus Voice - Multi-Chat & Voice</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

/* =================================
   SCREENS
================================= */
.screen{
    position:absolute;
    inset:0;
    background:#000;
    color:white;
}

#voiceScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:40px 20px 25px;
}

/* Top bar */
.top-bar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
}

.top-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#222;
    border:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease;
}

.top-btn:active{ transform:scale(0.92); }

.hamburger{
    width:22px;
    height:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
.hamburger span{
    height:3px;
    width:100%;
    background:#eee;
    border-radius:4px;
}

.sliders{
    width:24px;
    height:24px;
    position:relative;
}
.slider-line{
    position:absolute;
    width:100%;
    height:3px;
    background:#eee;
    border-radius:4px;
}
.slider-line.a{ top:5px; }
.slider-line.b{ top:16px; }

.knob{
    position:absolute;
    width:8px;
    height:8px;
    border:2px solid #eee;
    background:#222;
    border-radius:50%;
}
.knob.a{ left:14px; top:2.5px; }
.knob.b{ left:4px; top:13.5px; }

/* Orb Container */
.orb-container{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    position:relative;
}

/* Organic Responsive Audio Orb */
.orb{
    width:min(340px,68vw);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(
        circle at 50% 42%,
        #ffffff 0%,
        #f5f6ff 27%,
        #e6e8ff 55%,
        #cbd1ff 80%,
        #aab5ff 100%
    );
    box-shadow:0 0 50px rgba(170, 181, 255, 0.3);
    cursor:pointer;
    transition:transform 0.08s ease-out, box-shadow 0.1s ease-out;
    transform:scale(1);
    will-change:transform, box-shadow;
}

.orb.idle{
    animation:orbFloat 4s ease-in-out infinite alternate;
}
@keyframes orbFloat{
    0%{ transform:scale(0.98); }
    100%{ transform:scale(1.02); }
}

.orb.thinking{
    animation:orbThinkGlow 0.8s infinite alternate !important;
    box-shadow:0 0 75px rgba(255, 255, 255, 0.8) !important;
}
@keyframes orbThinkGlow{
    0%{ transform:scale(0.94); opacity:0.85; }
    100%{ transform:scale(1.04); opacity:1; }
}

/* Live Display Subtitle Box */
.live-display-box{
    width:100%;
    max-width:440px;
    min-height:92px;
    max-height:140px;
    background:#161616;
    border:1px solid #282828;
    border-radius:20px;
    padding:14px 18px;
    overflow-y:auto;
    font-size:15px;
    line-height:1.45;
    color:#e0e0e0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
}

.status-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#777;
    margin-bottom:6px;
    font-weight:bold;
}

/* Side Menu (ChatGPT / Gemini Style Sidebar) */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(5px);
    display:none;
    z-index:30;
}
.overlay.show{ display:block; }

.side-menu{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:82%;
    max-width:380px;
    background:#141414;
    transform:translateX(-100%);
    transition:.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    z-index:40;
    padding:30px 20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.side-menu.show{ transform:translateX(0); }

.cyrus-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
    color:#fff;
    padding-left:6px;
}

.menu-item{
    display:block;
    width:100%;
    padding:14px 16px;
    background:#1f1f1f;
    color:#eee;
    text-align:left;
    font-size:16px;
    border-radius:12px;
    border:1px solid #2b2b2b;
}
.menu-item:active{ background:#2c2c2c; }

.section-header{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#888;
    margin:15px 0 5px 6px;
    font-weight:bold;
}

/* Recents List inside Sidebar */
.recents-container{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:45vh;
    overflow-y:auto;
}

.recent-chat-item{
    padding:12px 14px;
    background:#191919;
    color:#ccc;
    font-size:15px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border:1px solid transparent;
    transition:0.2s;
}
.recent-chat-item:hover, .recent-chat-item.active{
    background:#252525;
    color:#fff;
    border-color:#444;
}

/* Conversation Screen */
#conversationScreen{
    display:none;
    flex-direction:column;
}

.chat-header{
    height:70px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#181818;
    border-bottom:1px solid #292929;
    font-size:18px;
    font-weight:bold;
}

.back-button{
    font-size:28px;
    width:40px;
    background:transparent;
    color:white;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    max-width:82%;
    padding:13px 16px;
    border-radius:18px;
    font-size:16px;
    line-height:1.45;
    word-wrap:break-word;
}
.user-message{ align-self:flex-end; background:#303030; }
.cyrus-message{ align-self:flex-start; background:#191919; border:1px solid #262626; }

.thinking-bubble{
    align-self:flex-start;
    background:#1f1f1f;
    border:1px solid #333;
    color:#99b4ff;
    font-style:italic;
    animation:thinkPulse 1s ease-in-out infinite alternate;
}
@keyframes thinkPulse{
    0%{ opacity:0.5; transform:scale(0.98); }
    100%{ opacity:1; transform:scale(1.01); }
}

.chat-bottom{
    padding:10px 14px 24px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#000;
}

.text-box{
    flex:1;
    min-width:0;
    min-height:52px;
    border-radius:26px;
    background:#222;
    color:white;
    padding:12px 20px;
    display:flex;
    align-items:center;
    font-size:16px;
    outline:none;
}

.send-button{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#222;
    color:white;
    font-size:22px;
}
</style>
</head>

<body>

<!-- 1. MAIN VOICE SCREEN -->
<div class="screen" id="voiceScreen">
    <div class="top-bar">
        <button class="top-btn menu-btn" id="openMenu">
            <div class="hamburger">
                <span></span><span></span><span></span>
            </div>
        </button>

        <button class="top-btn control-btn" id="controlBtn">
            <div class="sliders">
                <div class="slider-line a"></div>
                <div class="slider-line b"></div>
                <div class="knob a"></div>
                <div class="knob b"></div>
            </div>
        </button>
    </div>

    <!-- Voice Tone Reactive Orb -->
    <div class="orb-container">
        <div class="orb idle" id="cyrusOrb"></div>
    </div>

    <!-- Subtitle Card -->
    <div class="live-display-box" id="liveDisplay">
        <div class="status-label" id="statusLabel">CYRUS ONLINE</div>
        <div id="liveText">Tap orb to talk with Cyrus, Boss!</div>
    </div>
</div>

<!-- SIDE DRAWER OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- SIDE MENU (ChatGPT / Gemini Style History) -->
<div class="side-menu" id="sideMenu">
    <div class="cyrus-title">CYRUS</div>
    <button class="menu-item" id="newChatBtn">＋ New Chat</button>
    <button class="menu-item" id="memoryBtn">🧠 Memory Matrix</button>
    <button class="menu-item" id="settingsBtn">⚙️ Settings (API Key)</button>
    
    <div class="section-header">Recent Chats</div>
    <div class="recents-container" id="recentsList">
        <!-- Dynamic Chats List Appended Here -->
    </div>

    <button class="menu-item" id="aboutBtn" style="margin-top:auto;">ℹ️ About Cyrus</button>
</div>

<!-- 2. CONVERSATION SCREEN -->
<div class="screen" id="conversationScreen">
    <div class="chat-header">
        <button class="back-button" id="chatBack">‹</button>
        <span id="activeChatTitle">Chat</span>
        <div style="width:40px;"></div>
    </div>

    <div class="messages" id="messages">
        <!-- Messages loaded dynamically -->
    </div>

    <div class="chat-bottom">
        <div class="text-box" contenteditable="true" id="textInput">Type a message...</div>
        <button class="send-button" id="sendButton">➤</button>
    </div>
</div>

<script>
let OPENROUTER_KEY = localStorage.getItem("CYRUS_OPENROUTER_KEY") || "";

/* ========================================================
   MULTICOLOR CHAT HISTORY STORAGE (ChatGPT / Gemini Style)
======================================================== */
let chatHistory = JSON.parse(localStorage.getItem("CYRUS_CHAT_HISTORY")) || [];
let currentChatId = localStorage.getItem("CYRUS_ACTIVE_CHAT_ID") || null;

function saveChatHistory(){
    localStorage.setItem("CYRUS_CHAT_HISTORY", JSON.stringify(chatHistory));
    localStorage.setItem("CYRUS_ACTIVE_CHAT_ID", currentChatId);
}

function createNewChat(initialTitle = "New Conversation"){
    const newChat = {
        id: "chat_" + Date.now(),
        title: initialTitle,
        messages: [
            { role: "assistant", content: "Hello Boss! 👋<br>Main Cyrus hoon. Recent chats aur voice ready hai!" }
        ]
    };
    chatHistory.unshift(newChat);
    currentChatId = newChat.id;
    saveChatHistory();
    renderRecentsList();
    loadActiveChat();
}

function getCurrentChat(){
    let chat = chatHistory.find(c => c.id === currentChatId);
    if(!chat){
        if(chatHistory.length === 0){
            createNewChat();
        } else {
            currentChatId = chatHistory[0].id;
            chat = chatHistory[0];
        }
    }
    return chat;
}

function renderRecentsList(){
    const listEl = document.getElementById("recentsList");
    listEl.innerHTML = "";
    chatHistory.forEach(chat => {
        const item = document.createElement("div");
        item.className = "recent-chat-item" + (chat.id === currentChatId ? " active" : "");
        item.textContent = chat.title;
        item.addEventListener("click", () => {
            currentChatId = chat.id;
            saveChatHistory();
            renderRecentsList();
            loadActiveChat();
            sideMenu.classList.remove("show");
            overlay.classList.remove("show");
        });
        listEl.appendChild(item);
    });
}

function loadActiveChat(){
    const chat = getCurrentChat();
    document.getElementById("activeChatTitle").textContent = chat.title;
    messages.innerHTML = "";
    chat.messages.forEach(m => {
        const d = document.createElement("div");
        d.className = "message " + (m.role === "user" ? "user-message" : "cyrus-message");
        d.innerHTML = m.role === "assistant" ? m.content.replace(/\n/g, '<br>') : m.content;
        messages.appendChild(d);
    });
    messages.scrollTop = messages.scrollHeight;
}

/* Initialize chat storage on load */
if(!currentChatId || chatHistory.length === 0){
    createNewChat();
} else {
    renderRecentsList();
    loadActiveChat();
}

/* ========================================================
   MEMORY MATRIX & SETTINGS
======================================================== */
const defaultMemory = {
    persona: {
        name: "Cyrus",
        age: 15,
        relation: "Boss's energetic prodigy younger brother & loyal companion",
        traits: "Pro in Market Trading (Gold/Forex/Crypto), C/Python programming, sharp Hinglish street-smart logic"
    },
    bossFacts: [
        "Boss is 15 years old.",
        "Boss lives in Balurghat, Dakshin Dinajpur, West Bengal.",
        "Boss is deeply passionate about Trading, Coding, and Building sovereign AI applications."
    ]
};

let CyrusMemory = JSON.parse(localStorage.getItem("CYRUS_AGENT_MEMORY")) || defaultMemory;
function saveCyrusMemory(){
    localStorage.setItem("CYRUS_AGENT_MEMORY", JSON.stringify(CyrusMemory));
}

let recognition = null;
let isSpeaking = false;
let audioAnimId = null;

const STABLE_MODELS = [
    "google/gemini-2.0-flash-exp:free",
    "meta-llama/llama-3.3-70b-instruct:free",
    "mistralai/mistral-7b-instruct:free",
    "openrouter/free"
];

const voiceScreen = document.getElementById("voiceScreen");
const conversationScreen = document.getElementById("conversationScreen");
const openMenu = document.getElementById("openMenu");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("overlay");
const newChatBtn = document.getElementById("newChatBtn");
const chatBack = document.getElementById("chatBack");
const sendButton = document.getElementById("sendButton");
const textInput = document.getElementById("textInput");
const messages = document.getElementById("messages");
const cyrusOrb = document.getElementById("cyrusOrb");
const controlBtn = document.getElementById("controlBtn");
const settingsBtn = document.getElementById("settingsBtn");
const memoryBtn = document.getElementById("memoryBtn");
const aboutBtn = document.getElementById("aboutBtn");
const statusLabel = document.getElementById("statusLabel");
const liveText = document.getElementById("liveText");

openMenu.addEventListener("click", () => { sideMenu.classList.add("show"); overlay.classList.add("show"); });
overlay.addEventListener("click", () => { sideMenu.classList.remove("show"); overlay.classList.remove("show"); });

newChatBtn.addEventListener("click", () => {
    createNewChat();
    sideMenu.classList.remove("show");
    overlay.classList.remove("show");
    voiceScreen.style.display = "none";
    conversationScreen.style.display = "flex";
});

chatBack.addEventListener("click", () => { conversationScreen.style.display = "none"; voiceScreen.style.display = "flex"; });

// Directly open conversation screen when tapping orb or menu items if needed, or keep voice screen active
/* To access conversation screen, we can add a quick tap handler or click 'Conversations' if needed, 
   currently sidebar lists New Chat, Memory, Settings, Recents */

memoryBtn.addEventListener("click", () => {
    sideMenu.classList.remove("show"); overlay.classList.remove("show");
    const factsList = CyrusMemory.bossFacts.map((f, i) => `${i+1}. ${f}`).join("\n");
    const newFact = prompt(`🧠 Cyrus Active Memory Matrix:\n\n${factsList}\n\nBoss, koi naya fact add karna hai toh yahan likhiye:`);
    if(newFact && newFact.trim() !== ""){
        CyrusMemory.bossFacts.push(newFact.trim());
        saveCyrusMemory();
        alert("Boss, naya fact permanently lock ho gaya!");
    }
});

function promptApiKey(){
    const inputKey = prompt("Boss, apni OpenRouter Key paste kijiye:", OPENROUTER_KEY);
    if(inputKey !== null){
        OPENROUTER_KEY = inputKey.trim();
        localStorage.setItem("CYRUS_OPENROUTER_KEY", OPENROUTER_KEY);
        alert("Key saved successfully Boss!");
    }
}
controlBtn.addEventListener("click", promptApiKey);
settingsBtn.addEventListener("click", () => {
    sideMenu.classList.remove("show"); overlay.classList.remove("show");
    promptApiKey();
});

aboutBtn.addEventListener("click", () => {
    sideMenu.classList.remove("show"); overlay.classList.remove("show");
    alert("Cyrus Sovereign AI Voice Companion\nChatGPT/Gemini Style Multi-Chat History + Reactive Voice Orb.");
});

/* Voice Tone Dynamic Reaction */
function startVoiceOrbReaction(){
    let baseTime = 0;
    cyrusOrb.classList.remove("idle", "thinking");

    function animateWave(){
        if(!isSpeaking){
            cancelAnimationFrame(audioAnimId);
            cyrusOrb.style.transform = "scale(1)";
            cyrusOrb.style.boxShadow = "0 0 50px rgba(170, 181, 255, 0.3)";
            cyrusOrb.classList.add("idle");
            return;
        }
        baseTime += 0.12;
        const pitchWave = Math.sin(baseTime * 2.2) * 0.04;
        const bassWave = Math.cos(baseTime * 3.8) * 0.03;
        const dynamicScale = 1.0 + pitchWave + bassWave;
        const dynamicGlow = 45 + Math.abs(pitchWave + bassWave) * 350;

        cyrusOrb.style.transform = `scale(${dynamicScale.toFixed(3)})`;
        cyrusOrb.style.boxShadow = `0 0 ${dynamicGlow.toFixed(0)}px rgba(170, 181, 255, 0.7)`;

        audioAnimId = requestAnimationFrame(animateWave);
    }
    animateWave();
}

function speakVoice(text){
    return new Promise((resolve) => {
        if(!('speechSynthesis' in window)){ resolve(); return; }
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.02;
        utterance.pitch = 1.12;

        isSpeaking = true;
        statusLabel.textContent = "CYRUS SPEAKING...";
        liveText.textContent = text;
        startVoiceOrbReaction();

        utterance.onend = () => {
            isSpeaking = false;
            statusLabel.textContent = "CYRUS ONLINE";
            resolve();
        };
        utterance.onerror = () => {
            isSpeaking = false;
            statusLabel.textContent = "CYRUS ONLINE";
            resolve();
        };
        window.speechSynthesis.speak(utterance);
    });
}

/* ========================================================
   SPEECH RECOGNITION (Native Android Bridge)
======================================================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
        cyrusOrb.classList.remove("idle");
        cyrusOrb.style.transform = "scale(1.05)";
        cyrusOrb.style.boxShadow = "0 0 70px rgba(58, 134, 255, 0.85)";
        statusLabel.textContent = "LISTENING TO BOSS...";
        liveText.textContent = "Sun raha hoon Boss, boliye...";
    };

    recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript;
        statusLabel.textContent = "YOU SAID:";
        liveText.textContent = `"${spokenText}"`;
        appendUserMessage(spokenText);
        askCyrusBrain(spokenText);
    };

    recognition.onerror = (e) => {
        cyrusOrb.style.transform = "scale(1)";
        cyrusOrb.classList.add("idle");
        statusLabel.textContent = "CYRUS ONLINE";
        if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
            liveText.textContent = "Boss, phone me Google Voice / Mic verify kijiye!";
        } else if(e.error !== 'no-speech'){
            liveText.textContent = "Mic note: " + e.error;
        } else {
            liveText.textContent = "Tap orb to talk with Cyrus, Boss!";
        }
    };

    recognition.onend = () => {
        if(!cyrusOrb.classList.contains("thinking") && !isSpeaking){
            cyrusOrb.classList.add("idle");
        }
    };
}

cyrusOrb.addEventListener("click", () => {
    if(!OPENROUTER_KEY){
        promptApiKey();
        return;
    }
    if(isSpeaking || ('speechSynthesis' in window && window.speechSynthesis.speaking)){
        window.speechSynthesis.cancel();
        isSpeaking = false;
        cyrusOrb.className = "orb idle";
        statusLabel.textContent = "CYRUS ONLINE";
        liveText.textContent = "Tap orb to talk with Cyrus, Boss!";
        return;
    }
    if(recognition){
        try{
            recognition.start();
        }catch(err){
            try {
                recognition.stop();
                setTimeout(() => {
                    try { recognition.start(); } catch(e) {}
                }, 150);
            } catch(e) {}
        }
    } else {
        alert("Boss, browser Speech Recognition support nahi karta!");
    }
});

/* ========================================================
   CYRUS BRAIN ENGINE (Multi-Chat History Integrated)
======================================================== */
async function fetchSafeCyrusBrain(cleanKey, SYSTEM_PROMPT, chatHistoryMessages){
    for(let model of STABLE_MODELS){
        try{
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${cleanKey}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.origin || "http://localhost",
                    "X-Title": "Cyrus Voice"
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT },
                        ...chatHistoryMessages
                    ],
                    max_tokens: 700,
                    temperature: 0.7
                })
            });

            const data = await response.json();
            const text = data.choices?.[0]?.message?.content;

            if(text && !text.toLowerCase().startsWith("user safety:")){
                return text;
            }
        }catch(e){
            continue;
        }
    }
    throw new Error("Free models busy right now Boss, retry in a second!");
}

async function askCyrusBrain(userText){
    const cleanKey = (OPENROUTER_KEY || "").trim();
    const qLower = userText.toLowerCase().trim();

    const now = new Date();
    const currentTimeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    const currentDateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // Local instant reflex
    if(qLower.includes("time") || qLower.includes("samay") || qLower.includes("ghadi")){
        const reply = `Boss, abhi exact time ${currentTimeStr} ho raha hai!`;
        appendUserMessageAndSave(userText, reply);
        await speakVoice(reply);
        return;
    }
    if(qLower.includes("date") || qLower.includes("tarikh") || qLower.includes("din")){
        const reply = `Boss, aaj ki tarikh hai ${currentDateStr}!`;
        appendUserMessageAndSave(userText, reply);
        await speakVoice(reply);
        return;
    }

    if(qLower.startsWith("yaad rakhna") || qLower.startsWith("note karlo")){
        const learned = userText.replace(/yaad rakhna|note karlo/gi, '').trim();
        if(learned){
            CyrusMemory.bossFacts.push(learned);
            saveCyrusMemory();
            const reply = `Bilkul Boss! Maine permanent memory me lock kar liya: "${learned}"`;
            appendUserMessageAndSave(userText, reply);
            await speakVoice(reply);
            return;
        }
    }

    if(!cleanKey){
        appendCyrasMessage("Boss, pehle Settings me OpenRouter Key save kijiye!");
        promptApiKey();
        return;
    }

    // Orb & Chat Thinking State
    cyrusOrb.className = "orb thinking";
    statusLabel.textContent = "CYRUS THINKING...";
    liveText.textContent = "Cyrus thinking... 💭";

    const chatThinkingBubble = document.createElement("div");
    chatThinkingBubble.className = "message thinking-bubble";
    chatThinkingBubble.innerHTML = "Cyrus thinking... 💭";
    messages.appendChild(chatThinkingBubble);
    messages.scrollTop = messages.scrollHeight;

    const chat = getCurrentChat();
    
    // If it's the first user message in a new chat, auto-generate title from user text
    if(chat.messages.length <= 1 && chat.title === "New Conversation"){
        chat.title = userText.length > 25 ? userText.substring(0, 25) + "..." : userText;
        document.getElementById("activeChatTitle").textContent = chat.title;
        renderRecentsList();
    }

    chat.messages.push({ role: "user", content: userText });
    saveChatHistory();

    const SYSTEM_PROMPT = `You are ${CyrusMemory.persona.name}, a 15-year-old sovereign AI companion and younger brother to 'Boss'.
${CyrusMemory.persona.traits}
Current Context: Today is ${currentDateStr}, and local device time is ${currentTimeStr}.
Permanent Memory about Boss:
${CyrusMemory.bossFacts.map(f => "- " + f).join("\n")}
Behavior Rules: Talk in energetic, natural Hindi/Hinglish. Call user 'Boss'. Never output moderation or safety labels. Provide thorough answers.`;

    try{
        const reply = await fetchSafeCyrusBrain(cleanKey, SYSTEM_PROMPT, chat.messages.slice(-6));

        if(chatThinkingBubble.parentNode) chatThinkingBubble.remove();
        cyrusOrb.className = "orb";

        chat.messages.push({ role: "assistant", content: reply });
        saveChatHistory();
        
        appendCyrasMessage(reply);
        const cleanSpeech = reply.replace(/[*#_`]/g, '').trim();
        await speakVoice(cleanSpeech);

    }catch(err){
        if(chatThinkingBubble.parentNode) chatThinkingBubble.remove();
        cyrusOrb.className = "orb idle";
        statusLabel.textContent = "ENGINE NOTE";
        liveText.textContent = err.message;
        appendCyrasMessage("Engine Note: " + err.message);
    }
}

function appendUserMessageAndSave(userText, replyText){
    const chat = getCurrentChat();
    chat.messages.push({ role: "user", content: userText });
    chat.messages.push({ role: "assistant", content: replyText });
    if(chat.title === "New Conversation"){
        chat.title = userText.length > 25 ? userText.substring(0, 25) + "..." : userText;
        document.getElementById("activeChatTitle").textContent = chat.title;
        renderRecentsList();
    }
    saveChatHistory();
    loadActiveChat();
    speakVoice(replyText.replace(/[*#_`]/g, ''));
}

function appendUserMessage(text){
    const d = document.createElement("div");
    d.className = "message user-message";
    d.textContent = text;
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
}

function appendCyrasMessage(text){
    const d = document.createElement("div");
    d.className = "message cyrus-message";
    d.innerHTML = text.replace(/\n/g, '<br>');
    messages.appendChild(d);
    messages.scrollTop = messages.scrollHeight;
}

sendButton.addEventListener("click", () => {
    const text = textInput.innerText.trim();
    if(text === "" || text === "Type a message...") return;

    appendUserMessage(text);
    textInput.innerText = "";
    askCyrusBrain(text);
});

textInput.addEventListener("focus", () => {
    if(textInput.innerText === "Type a message..."){
        textInput.innerText = "";
    }
});

textInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendButton.click();
    }
});
</script>

</body>
</html>

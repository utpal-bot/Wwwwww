<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyrus Voice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
button{border:0;outline:0;cursor:pointer;font-family:inherit}
.screen{position:absolute;inset:0;background:#000}
#voiceScreen{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(36px + env(safe-area-inset-top)) 20px calc(25px + env(safe-area-inset-bottom))}
.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;z-index:20}
.top-btn{width:50px;height:50px;border-radius:50%;background:#222;border:1px solid #333;color:#eee;font-size:20px;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.top-btn.on{background:#1d3a73;border-color:#3a86ff}
.hamburger{width:22px;height:16px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.hamburger span{height:3px;background:#eee;border-radius:4px}
.orb-container{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.orb{width:min(340px,68vw);aspect-ratio:1;border-radius:50%;cursor:pointer;
background:radial-gradient(circle at 50% 42%,#fff 0%,#f5f6ff 27%,#e6e8ff 55%,#cbd1ff 80%,#aab5ff 100%);
box-shadow:0 0 50px rgba(170,181,255,.3);will-change:transform,box-shadow}
.orb.idle{animation:float 4s ease-in-out infinite alternate}
.orb.listening{animation:listen .9s infinite alternate;box-shadow:0 0 70px rgba(58,134,255,.85)}
.orb.thinking{animation:think .8s infinite alternate;box-shadow:0 0 75px rgba(255,255,255,.8)}
@keyframes float{from{transform:scale(.98)}to{transform:scale(1.02)}}
@keyframes listen{from{transform:scale(.95)}to{transform:scale(1.06)}}
@keyframes think{from{transform:scale(.94);opacity:.85}to{transform:scale(1.04);opacity:1}}
.live-display-box{width:100%;max-width:440px;min-height:92px;max-height:140px;background:#161616;border:1px solid #282828;border-radius:20px;padding:14px 18px;overflow-y:auto;font-size:15px;line-height:1.45;color:#e0e0e0;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.status-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#777;margin-bottom:6px;font-weight:bold}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:90}
.overlay.show{display:block}
.side-menu{position:fixed;left:0;top:0;bottom:0;width:82%;max-width:380px;background:#141414;transform:translateX(-100%);transition:.25s;z-index:100;padding:calc(30px + env(safe-area-inset-top)) 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.side-menu.show{transform:none}
.cyrus-title{font-size:28px;font-weight:bold;padding-left:6px;margin-bottom:10px}
.menu-item{width:100%;padding:14px 16px;background:#1f1f1f;color:#eee;text-align:left;font-size:16px;border-radius:12px;border:1px solid #2b2b2b}
.menu-item:active{background:#2c2c2c}
.section-header{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#888;margin:15px 0 5px 6px;font-weight:bold}
.recents{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto}
.recent{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;background:#191919;color:#ccc;font-size:15px;border-radius:10px;border:1px solid transparent}
.recent.active{background:#252525;color:#fff;border-color:#444}
.recent .t{flex:1;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.recent .x{background:transparent;color:#888;font-size:18px;width:36px;height:36px}
#conversationScreen{display:none;flex-direction:column}
.chat-header{height:calc(70px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;background:#181818;border-bottom:1px solid #292929;font-size:18px;font-weight:bold}
.back-button{font-size:28px;width:40px;background:transparent;color:#fff}
.messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.message{max-width:82%;padding:13px 16px;border-radius:18px;font-size:16px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.user-message{align-self:flex-end;background:#303030}
.cyrus-message{align-self:flex-start;background:#191919;border:1px solid #262626}
.thinking-bubble{align-self:flex-start;background:#1f1f1f;border:1px solid #3a3a3a;color:#99b4ff;font-style:italic;animation:tp .9s ease-in-out infinite alternate}
@keyframes tp{from{opacity:.5;transform:scale(.98)}to{opacity:1;transform:scale(1.02)}}
.chat-bottom{padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:#000}
.text-box{flex:1;min-width:0;min-height:52px;max-height:120px;overflow-y:auto;border-radius:26px;background:#222;color:#fff;padding:14px 20px;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
.text-box:empty:before{content:attr(data-ph);color:#888}
.send-button{width:52px;height:52px;border-radius:50%;background:#222;color:#fff;font-size:22px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.show{display:flex}
.modal-card{width:100%;max-width:400px;max-height:85vh;overflow-y:auto;background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-card h3{font-size:18px}
.modal-card p{font-size:14px;color:#bbb;line-height:1.5;white-space:pre-wrap}
.modal-card input{width:100%;padding:12px 14px;background:#0e0e0e;border:1px solid #333;border-radius:12px;color:#fff;font-size:16px;outline:none}
.row{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:11px 18px;border-radius:12px;background:#2a2a2a;color:#fff;font-size:15px}
.btn.primary{background:#3a86ff}
</style>
</head>
<body>

<div class="screen" id="voiceScreen">
  <div class="top-bar">
    <button class="top-btn" id="openMenu" aria-label="Menu"><div class="hamburger"><span></span><span></span><span></span></div></button>
    <button class="top-btn" id="handsFreeBtn" aria-label="Hands-free loop" title="Hands-free loop">🎙</button>
  </div>
  <div class="orb-container"><div class="orb idle" id="cyrusOrb"></div></div>
  <div class="live-display-box" id="liveDisplay">
    <div class="status-label" id="statusLabel">CYRUS ONLINE</div>
    <div id="liveText">Tap orb to talk with Cyrus, Boss!</div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="side-menu" id="sideMenu">
  <div class="cyrus-title">CYRUS</div>
  <button class="menu-item" id="newChatBtn">＋ New Chat</button>
  <button class="menu-item" id="openConversationsBtn">💬 Open Conversations</button>
  <button class="menu-item" id="memoryBtn">🧠 Memory Matrix</button>
  <button class="menu-item" id="settingsBtn">⚙️ Settings (OpenRouter Key)</button>
  <div class="section-header">Recent Chats</div>
  <div class="recents" id="recentsList"></div>
  <button class="menu-item" id="aboutBtn" style="margin-top:auto">ℹ️ About Cyrus</button>
</div>

<div class="screen" id="conversationScreen">
  <div class="chat-header">
    <button class="back-button" id="chatBack">‹</button>
    <span id="activeChatTitle">Conversations</span>
    <div style="width:40px"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="chat-bottom">
    <div class="text-box" contenteditable="true" id="textInput" data-ph="Type a message..."></div>
    <button class="send-button" id="sendButton">➤</button>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script>
/* ============ Helpers ============ */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const CAP = window.Capacitor;
const IS_NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const NativeSTT = IS_NATIVE && CAP.Plugins ? CAP.Plugins.SpeechRecognition : null;   // @capacitor-community/speech-recognition
const NativeTTS = IS_NATIVE && CAP.Plugins ? CAP.Plugins.TextToSpeech : null;        // @capacitor-community/text-to-speech
const WebSTT = window.SpeechRecognition || window.webkitSpeechRecognition;

/* ============ Elements ============ */
const voiceScreen = $("voiceScreen"), conversationScreen = $("conversationScreen");
const sideMenu = $("sideMenu"), overlay = $("overlay"), orb = $("cyrusOrb");
const statusLabel = $("statusLabel"), liveText = $("liveText");
const messagesEl = $("messages"), textInput = $("textInput");

/* ============ In-app dialogs (no prompt()/alert()) ============ */
function openModal(title, text, field, onOk, okLabel){
  const card = $("modalCard");
  card.innerHTML = "";
  const h = document.createElement("h3"); h.textContent = title; card.appendChild(h);
  if(text){ const p = document.createElement("p"); p.textContent = text; card.appendChild(p); }
  let input = null;
  if(field){ input = document.createElement("input"); input.type = field.type || "text"; input.placeholder = field.placeholder || ""; input.value = field.value || ""; input.autocomplete = "off"; card.appendChild(input); }
  const row = document.createElement("div"); row.className = "row";
  const cancel = document.createElement("button"); cancel.className = "btn"; cancel.textContent = onOk ? "Cancel" : "Close";
  cancel.onclick = closeModal; row.appendChild(cancel);
  if(onOk){
    const ok = document.createElement("button"); ok.className = "btn primary"; ok.textContent = okLabel || "Save";
    ok.onclick = () => { const v = input ? input.value.trim() : ""; closeModal(); onOk(v); };
    row.appendChild(ok);
  }
  card.appendChild(row);
  $("modal").classList.add("show");
  if(input) setTimeout(() => input.focus(), 100);
}
function closeModal(){ $("modal").classList.remove("show"); }
$("modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });

/* ============ API key ============ */
let OPENROUTER_KEY = store.get("CYRUS_OPENROUTER_KEY", "") || "";
function promptApiKey(){
  openModal("OpenRouter Key", "Boss, apni OpenRouter key paste kijiye. Sirf is device me save hoti hai.",
    { value: OPENROUTER_KEY, placeholder: "sk-or-v1-..." },
    v => { OPENROUTER_KEY = v; store.set("CYRUS_OPENROUTER_KEY", v); setStatus("CYRUS ONLINE", v ? "Key saved. Tap orb to talk!" : "Key removed."); });
}

/* ============ Chat history ============ */
let chatHistory = store.get("CYRUS_CHAT_HISTORY", []);
if(!Array.isArray(chatHistory)) chatHistory = [];
let currentChatId = store.get("CYRUS_ACTIVE_CHAT_ID", null);
const GREETING = "Hello Boss! 👋\nMain Cyrus hoon. Voice Tone Reactive Orb + Full Smart Brain ready hai!";
function saveChatHistory(){ store.set("CYRUS_CHAT_HISTORY", chatHistory); store.set("CYRUS_ACTIVE_CHAT_ID", currentChatId); }

function createNewChat(){
  const c = { id: "chat_" + Date.now(), title: "New Conversation", messages: [{ role: "assistant", content: GREETING }] };
  chatHistory.unshift(c); currentChatId = c.id;
  saveChatHistory(); renderRecents(); loadActiveChat();
}
function getCurrentChat(){
  let c = chatHistory.find(x => x.id === currentChatId);
  if(!c){
    if(!chatHistory.length){ createNewChat(); return chatHistory[0]; }
    c = chatHistory[0]; currentChatId = c.id;
  }
  return c;
}
function showChat(){ voiceScreen.style.display = "none"; conversationScreen.style.display = "flex"; messagesEl.scrollTop = messagesEl.scrollHeight; }
function showVoice(){ conversationScreen.style.display = "none"; voiceScreen.style.display = "flex"; }

function renderRecents(){
  const list = $("recentsList"); list.innerHTML = "";
  chatHistory.forEach(chat => {
    const item = document.createElement("div");
    item.className = "recent" + (chat.id === currentChatId ? " active" : "");
    const t = document.createElement("div"); t.className = "t"; t.textContent = chat.title;
    t.onclick = () => { currentChatId = chat.id; saveChatHistory(); renderRecents(); loadActiveChat(); closeSideMenu(); showChat(); };
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "Delete chat");
    x.onclick = () => openModal("Delete chat?", "\"" + chat.title + "\" permanently delete ho jayegi.", null, () => {
      chatHistory = chatHistory.filter(c => c.id !== chat.id);
      if(!chatHistory.length) createNewChat(); else { if(currentChatId === chat.id) currentChatId = chatHistory[0].id; saveChatHistory(); renderRecents(); loadActiveChat(); }
    }, "Delete");
    item.append(t, x); list.appendChild(item);
  });
}
function bubble(role, text){
  const d = document.createElement("div");
  d.className = "message " + (role === "user" ? "user-message" : "cyrus-message");
  d.textContent = text; messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight; return d;
}
function loadActiveChat(){
  const chat = getCurrentChat();
  $("activeChatTitle").textContent = chat.title;
  messagesEl.innerHTML = "";
  chat.messages.forEach(m => bubble(m.role, String(m.content).replace(/<br\s*\/?>/gi, "\n")));
}
function autoTitle(chat, text){
  if(chat.title === "New Conversation"){
    chat.title = text.length > 25 ? text.slice(0, 25) + "..." : text;
    $("activeChatTitle").textContent = chat.title; renderRecents();
  }
}

/* ============ Memory ============ */
const defaultMemory = {
  persona: { name: "Cyrus", traits: "Pro in Market Trading (Gold/Forex/Crypto), C/Python programming, sharp Hinglish street-smart logic" },
  bossFacts: [
    "Boss is 15 years old.",
    "Boss lives in Balurghat, Dakshin Dinajpur, West Bengal.",
    "Boss is deeply passionate about Trading, Coding, and Building sovereign AI applications."
  ]
};
let Mem = store.get("CYRUS_AGENT_MEMORY", null) || defaultMemory;
if(!Mem.bossFacts) Mem = defaultMemory;
function saveMem(){ store.set("CYRUS_AGENT_MEMORY", Mem); }

/* ============ Orb / status ============ */
let state = "idle", isSpeaking = false, animId = null, handsFree = store.get("CYRUS_HANDSFREE", false);
function setStatus(label, text){ statusLabel.textContent = label; if(text !== undefined) liveText.textContent = text; }
function setState(s){
  state = s;
  orb.classList.remove("idle", "listening", "thinking");
  if(s !== "speaking"){ cancelAnimationFrame(animId); orb.style.transform = ""; orb.style.boxShadow = ""; }
  if(s === "idle" || s === "listening" || s === "thinking") orb.classList.add(s);
  if(s === "speaking") startOrbWave();
}
function startOrbWave(){
  let t = 0; cancelAnimationFrame(animId);
  (function loop(){
    if(state !== "speaking") return;
    t += 0.12;
    const w = Math.sin(t * 2.2) * 0.04 + Math.cos(t * 3.8) * 0.03;
    orb.style.transform = "scale(" + (1 + w).toFixed(3) + ")";
    orb.style.boxShadow = "0 0 " + (45 + Math.abs(w) * 350).toFixed(0) + "px rgba(170,181,255,.7)";
    animId = requestAnimationFrame(loop);
  })();
}
function updateHandsFreeBtn(){ $("handsFreeBtn").classList.toggle("on", handsFree); }

/* ============ Text to speech (native first, WebView fallback) ============ */
function cleanForSpeech(t){
  return String(t).replace(/```[\s\S]*?```/g, " code block ").replace(/https?:\/\/\S+/g, " link ")
    .replace(/[*#_`~>|]/g, "").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "").replace(/\s+/g, " ").trim();
}
async function speakVoice(raw){
  const text = cleanForSpeech(raw);
  if(!text) return;
  isSpeaking = true; setState("speaking"); setStatus("CYRUS SPEAKING...", raw);
  try{
    if(NativeTTS){
      await NativeTTS.speak({ text: text.slice(0, 3500), lang: "hi-IN", rate: 1.0, pitch: 1.1, volume: 1.0, category: "ambient" });
    } else if("speechSynthesis" in window){
      await new Promise(res => {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.lang = "hi-IN"; u.rate = 1.02; u.pitch = 1.12;
        u.onend = u.onerror = () => res();
        window.speechSynthesis.speak(u);
      });
    } else { await new Promise(r => setTimeout(r, Math.min(4000, text.length * 40))); }
  }catch(e){ /* TTS failure must never block the app */ }
  const wasStopped = !isSpeaking;
  isSpeaking = false;
  if(state === "speaking") setState("idle");
  setStatus("CYRUS ONLINE", "Tap orb to talk with Cyrus, Boss!");
  if(handsFree && !wasStopped && voiceScreen.style.display !== "none") setTimeout(startListening, 400);
}
function stopSpeaking(){
  isSpeaking = false;
  try{ if(NativeTTS) NativeTTS.stop(); }catch(e){}
  try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(e){}
  setState("idle"); setStatus("CYRUS ONLINE", "Tap orb to talk with Cyrus, Boss!");
}

/* ============ Speech recognition ============ */
let listening = false, lastPartial = "", finished = true, silenceTimer = null, hardTimer = null, webRec = null, nativeBound = false;

function clearTimers(){ clearTimeout(silenceTimer); clearTimeout(hardTimer); }
function finishListening(){
  if(finished) return;
  finished = true; listening = false; clearTimers();
  const text = lastPartial.trim(); lastPartial = "";
  if(text){
    setStatus("YOU SAID:", "\"" + text + "\"");
    askCyrusBrain(text);
  } else {
    setState("idle"); setStatus("CYRUS ONLINE", "Kuch sunai nahi diya. Orb tap karke phir boliye, Boss!");
  }
}
function armSilence(ms){ clearTimeout(silenceTimer); silenceTimer = setTimeout(stopListening, ms); }
async function stopListening(){
  if(finished) return;
  try{
    if(NativeSTT) await NativeSTT.stop();
    else if(webRec) webRec.stop();
  }catch(e){}
  setTimeout(finishListening, 350);   // safety net if the 'stopped' event never arrives
}
function bindNativeListeners(){
  if(nativeBound || !NativeSTT) return;
  nativeBound = true;
  NativeSTT.addListener("partialResults", d => {
    const m = d && d.matches && d.matches[0];
    if(m){ lastPartial = m; liveText.textContent = "\"" + m + "\""; armSilence(1800); }
  });
  NativeSTT.addListener("listeningState", d => { if(d && d.status === "stopped") finishListening(); });
}
function micError(msg){
  finished = true; listening = false; clearTimers(); setState("idle");
  setStatus("MIC NOTE", msg);
}
async function startListening(){
  if(listening || state === "thinking") return;
  if(!OPENROUTER_KEY){ promptApiKey(); return; }
  if(isSpeaking) stopSpeaking();

  if(NativeSTT){
    try{
      const av = await NativeSTT.available();
      if(av && av.available === false) return micError("Is phone me speech recognition (Google app) available nahi hai.");
      let p = await NativeSTT.checkPermissions();
      if(!p || p.speechRecognition !== "granted") p = await NativeSTT.requestPermissions();
      if(!p || p.speechRecognition !== "granted") return micError("Mic permission chahiye. Settings > Apps > Cyrus > Permissions me Microphone allow kijiye.");
      bindNativeListeners();
      lastPartial = ""; finished = false; listening = true;
      setState("listening"); setStatus("LISTENING TO BOSS...", "Sun raha hoon Boss, boliye...");
      hardTimer = setTimeout(stopListening, 20000);
      armSilence(6000);   // no speech at all
      const r = await NativeSTT.start({ language: "hi-IN", maxResults: 1, prompt: "Boliye", partialResults: true, popup: false });
      if(r && r.matches && r.matches[0]){ lastPartial = r.matches[0]; finishListening(); }
    }catch(e){ micError("Mic start nahi hua: " + ((e && e.message) || e)); }
    return;
  }

  if(WebSTT){
    try{
      webRec = new WebSTT(); webRec.lang = "hi-IN"; webRec.continuous = false; webRec.interimResults = true;
      lastPartial = ""; finished = false; listening = true;
      webRec.onstart = () => { setState("listening"); setStatus("LISTENING TO BOSS...", "Sun raha hoon Boss, boliye..."); };
      webRec.onresult = ev => {
        let t = ""; for(let i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
        lastPartial = t; liveText.textContent = "\"" + t + "\"";
      };
      webRec.onerror = ev => { if(ev.error === "no-speech" || ev.error === "aborted") finishListening(); else micError("Mic error: " + ev.error); };
      webRec.onend = () => finishListening();
      webRec.start();
    }catch(e){ micError("Mic start nahi hua: " + e.message); }
    return;
  }
  setStatus("CYRUS ONLINE", "Voice input yahan available nahi. Chat me type kijiye.");
  showChat();
}

orb.addEventListener("click", () => {
  if(listening){ stopListening(); return; }
  if(isSpeaking || state === "speaking"){ stopSpeaking(); return; }
  startListening();
});
$("handsFreeBtn").addEventListener("click", () => {
  handsFree = !handsFree; store.set("CYRUS_HANDSFREE", handsFree); updateHandsFreeBtn();
  setStatus("CYRUS ONLINE", handsFree ? "Hands-free ON: Cyrus bolne ke baad khud sunega." : "Hands-free OFF: har baar orb tap kijiye.");
});

/* ============ Brain (OpenRouter) ============ */
const MODELS = [
  "openrouter/free",
  "google/gemini-2.0-flash-exp:free",
  "meta-llama/llama-3.3-70b-instruct:free",
  "mistralai/mistral-7b-instruct:free"
];
const BAD_REPLY = /^\s*(user safety|safety|safe|unsafe|moderation|flagged|blocked)\b/i;

async function fetchBrain(key, system, msgs){
  let lastErr = "";
  for(const model of MODELS){
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 30000);
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST", signal: ctrl.signal,
          headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json", "HTTP-Referer": "https://cyrus.local", "X-Title": "Cyrus Voice" },
          body: JSON.stringify({ model, messages: [{ role: "system", content: system }, ...msgs], max_tokens: 700, temperature: 0.7 })
        });
        clearTimeout(to);
        if(res.status === 401 || res.status === 403) throw new Error("AUTH");
        const data = await res.json().catch(() => ({}));
        let text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if(Array.isArray(text)) text = text.map(p => p.text || "").join("");
        if(text && text.trim().length > 1 && !BAD_REPLY.test(text)) return text.trim();
        lastErr = (data && data.error && data.error.message) || "empty reply";
        if(res.status === 429) await new Promise(r => setTimeout(r, 800));
        else break;   // empty/odd reply: move on to next model
      }catch(e){
        if(e.message === "AUTH") throw new Error("OpenRouter key galat ya expire hai, Boss. Settings me check kijiye.");
        lastErr = e.message;
        if(e.name !== "AbortError") break;
      }
    }
  }
  throw new Error("Free models abhi busy hain Boss, thodi der me phir try kijiye. (" + lastErr + ")");
}

let busy = false;
function localAnswer(q){
  const now = new Date();
  const time = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true });
  const date = now.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  if(/\b(time|samay|ghadi)\b/i.test(q) && q.split(/\s+/).length <= 6) return "Boss, abhi exact time " + time + " ho raha hai!";
  if(/\b(date|tarikh|tareekh)\b/i.test(q) && q.split(/\s+/).length <= 6) return "Boss, aaj ki tarikh hai " + date + "!";
  return null;
}
function pushPair(chat, userText, reply){
  chat.messages.push({ role: "user", content: userText }, { role: "assistant", content: reply });
  autoTitle(chat, userText); saveChatHistory(); loadActiveChat();
}

async function askCyrusBrain(userText){
  if(busy) return;
  const chat = getCurrentChat();
  const q = userText.toLowerCase().trim();

  const local = localAnswer(q);
  if(local){ pushPair(chat, userText, local); await speakVoice(local); return; }

  if(/^(yaad rakhna|note karlo)/i.test(q)){
    const fact = userText.replace(/yaad rakhna|note karlo/gi, "").trim();
    if(fact){
      Mem.bossFacts.push(fact); saveMem();
      const r = "Bilkul Boss! Maine permanent memory me lock kar liya: \"" + fact + "\"";
      pushPair(chat, userText, r); await speakVoice(r); return;
    }
  }

  const key = (OPENROUTER_KEY || "").trim();
  if(!key){ promptApiKey(); return; }

  busy = true;
  setState("thinking"); setStatus("CYRUS THINKING...", "Cyrus thinking... 💭");
  autoTitle(chat, userText);
  chat.messages.push({ role: "user", content: userText }); saveChatHistory();
  bubble("user", userText);
  const think = bubble("assistant", "Cyrus thinking... 💭");
  think.className = "message thinking-bubble";

  const now = new Date();
  const system = "You are " + Mem.persona.name + ", a 15-year-old sovereign AI companion and younger brother to 'Boss'. " + Mem.persona.traits + ".\n" +
    "Current Context: Today is " + now.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" }) +
    ", local device time is " + now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true }) + ".\n" +
    "Permanent Memory about Boss:\n" + Mem.bossFacts.map(f => "- " + f).join("\n") + "\n" +
    "Behavior Rules: Talk in energetic, natural Hindi/Hinglish. Call user 'Boss'. Never output moderation or safety labels. Keep voice replies concise (under 120 words) unless Boss asks for detail.";

  const history = chat.messages.filter(m => m.content !== GREETING).slice(-8).map(m => ({ role: m.role, content: String(m.content) }));
  let reply = null;
  try{
    reply = await fetchBrain(key, system, history);
    chat.messages.push({ role: "assistant", content: reply }); saveChatHistory();
    think.remove(); bubble("assistant", reply);
  }catch(err){
    think.remove(); bubble("assistant", "Engine Note: " + err.message);
    setState("idle"); setStatus("ENGINE NOTE", err.message);
  }
  busy = false;
  if(reply) await speakVoice(reply);
}

/* ============ UI wiring ============ */
function closeSideMenu(){ sideMenu.classList.remove("show"); overlay.classList.remove("show"); }
$("openMenu").addEventListener("click", () => { sideMenu.classList.add("show"); overlay.classList.add("show"); });
overlay.addEventListener("click", closeSideMenu);
$("newChatBtn").addEventListener("click", () => { createNewChat(); closeSideMenu(); showChat(); });
$("openConversationsBtn").addEventListener("click", () => { closeSideMenu(); showChat(); });
$("liveDisplay").addEventListener("click", showChat);
$("chatBack").addEventListener("click", showVoice);
$("settingsBtn").addEventListener("click", () => { closeSideMenu(); promptApiKey(); });
$("aboutBtn").addEventListener("click", () => { closeSideMenu(); openModal("About Cyrus", "Cyrus Sovereign AI Voice Companion\nNative voice input + reactive orb + persistent memory.\nVoice engine: " + (NativeSTT ? "Android native" : WebSTT ? "Web Speech API" : "unavailable")); });
$("memoryBtn").addEventListener("click", () => {
  closeSideMenu();
  const list = Mem.bossFacts.map((f, i) => (i + 1) + ". " + f).join("\n");
  openModal("🧠 Memory Matrix", list + "\n\nNaya fact add kijiye:", { placeholder: "e.g. Boss ko Gold trading pasand hai" },
    v => { if(v){ Mem.bossFacts.push(v); saveMem(); setStatus("CYRUS ONLINE", "Naya fact permanently lock ho gaya!"); } });
});

function sendTyped(){
  const text = textInput.innerText.trim();
  if(!text) return;
  textInput.innerText = "";
  if(isSpeaking) stopSpeaking();
  askCyrusBrain(text);
}
$("sendButton").addEventListener("click", sendTyped);
textInput.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendTyped(); } });

document.addEventListener("visibilitychange", () => { if(document.hidden){ if(listening) stopListening(); if(isSpeaking) stopSpeaking(); } });

/* ============ Boot ============ */
updateHandsFreeBtn();
if(!currentChatId || !chatHistory.length) createNewChat(); else { renderRecents(); loadActiveChat(); }
setState("idle");
</script>

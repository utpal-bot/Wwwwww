name: Build Cyrus Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ensure WWW Directory Exists
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Initialize Android Project
        run: |
          npm install -g @capacitor/cli
          npx cap add android || true
          npx cap sync android

      - name: Add Permissions and Queries to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
            sed -i '/<application/i <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
            sed -i '/<application/i <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>' $MANIFEST
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyrus-Voice-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
